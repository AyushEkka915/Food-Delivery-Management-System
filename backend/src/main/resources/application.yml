spring:
  application:
    name: food-delivery

  # Active profile is selected by SPRING_PROFILES_ACTIVE (defaults to dev).
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Datasource defaults are overridden per profile.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/food_delivery?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:foodapp}
    password: ${DB_PASSWORD:CHANGE_ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    # Flyway owns the schema; Hibernate only validates it.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    # Serialise enums as their name; keep money as BigDecimal strings.
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

# Application-specific settings (read by AppProperties in a later phase)
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_at_least_32_characters_long_random_string}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  pricing:
    tax-percent: ${TAX_PERCENT:5.00}
    delivery-base-fee: ${DELIVERY_BASE_FEE:20.00}
    delivery-per-km-fee: ${DELIVERY_PER_KM_FEE:8.00}
    platform-commission-percent: ${PLATFORM_COMMISSION_PERCENT:12.00}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
