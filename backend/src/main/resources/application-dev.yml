# Development profile
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/food_delivery?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:foodapp}
    password: ${DB_PASSWORD:CHANGE_ME}
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    clean-disabled: true

logging:
  level:
    root: INFO
    com.fooddelivery: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  error:
    include-message: always
